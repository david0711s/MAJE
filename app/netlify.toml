# Netlify-Konfiguration für die MAJE Web-App (PWA)
# Basis-Verzeichnis beim Git-Deploy: "app"
# Manueller Build:  npx expo export --platform web   ->  publish-Ordner "dist"

[build]
  command = "npx expo export --platform web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-Page-App: unbekannte Pfade auf index.html umleiten
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
