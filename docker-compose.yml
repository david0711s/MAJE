###############################################################################
#  MAJE v3 – Deployment für den IONOS-Server unter /opt/MAJE
#
#  Verwendung:
#    1. Repo nach /opt/MAJE klonen/kopieren
#    2. `cp .env.example .env` und JWT_SECRET setzen
#    3. `getent group docker | cut -d: -f3`  ->  als DOCKER_GID in die .env
#    4. `docker compose up -d --build`
#
#  Persistente Daten liegen unter /opt/MAJE/data (Workspace, Soul, SQLite).
###############################################################################

name: maje

services:
  maje-backend:
    build:
      # Build context = backend/ (so main.py liegt auf /app/main.py)
      context: ./backend
      dockerfile: Dockerfile
    container_name: maje-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MAJE_ROOT=/maje
      - SQLITE_PATH=/maje/soul/maje.db
      - REDIS_HOST=maje-redis
      - REDIS_PORT=6379
      - DOCKER_HOST=tcp://maje-docker-proxy:2375
      - JWT_SECRET=${JWT_SECRET:?Bitte JWT_SECRET in .env setzen}
      - ALLOW_ORIGINS=${ALLOW_ORIGINS:-*}
      - ALLOW_ORIGIN_REGEX=${ALLOW_ORIGIN_REGEX:-}
      - SANDBOX_MAX_MEMORY_MB=${SANDBOX_MAX_MEMORY_MB:-512}
      - SANDBOX_CPU_QUOTA=${SANDBOX_CPU_QUOTA:-1.0}
      - SANDBOX_TIMEOUT_SECONDS=${SANDBOX_TIMEOUT_SECONDS:-60}
      - SANDBOX_ALLOW_NETWORK=${SANDBOX_ALLOW_NETWORK:-0}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
    volumes:
      # Persistenter MAJE-Workspace (Soul, Memory, Files, SQLite)
      - /opt/MAJE/data:/maje
      # API-Keys / config (config/api_keys.py, config/keys.json)
      - /opt/MAJE/config:/app/config
      # HINWEIS: Kein direkter Docker-Socket mehr! Der Zugriff läuft über
      # den eingeschränkten "maje-docker-proxy" (siehe unten).
    depends_on:
      - maje-redis
      - maje-docker-proxy
    mem_limit: 2500m
    cpus: "2.0"

  maje-docker-proxy:
    # Eingeschränkter Zugriff auf den Docker-Socket (statt Root-Socket im Backend).
    image: tecnativa/docker-socket-proxy:latest
    container_name: maje-docker-proxy
    restart: unless-stopped
    environment:
      # Nur das, was die Sandbox wirklich braucht:
      - CONTAINERS=1        # Container anlegen/ansehen
      - IMAGES=1            # Sandbox-Images prüfen/pullen
      - POST=1              # create/start/wait/logs/remove (POST/DELETE)
      - ALLOW_START=1
      - ALLOW_STOP=1
      - ALLOW_RESTARTS=1    # enthält kill
      # Bewusst NICHT erlaubt:
      - EXEC=0              # kein "docker exec" (kein Betreten von Containern)
      - NETWORKS=0
      - VOLUMES=0
      - SWARM=0
      - SYSTEM=0
      - BUILD=0
      - AUTH=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Nur intern im Compose-Netz erreichbar (kein "ports:"!)

  maje-redis:
    image: redis:7-alpine
    container_name: maje-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - /opt/MAJE/redis:/data
    mem_limit: 512m

  # Optionaler HTTPS-Reverse-Proxy (nur mit Profile "proxy"):
  #   docker compose --profile proxy up -d
  # Voraussetzung: DOMAIN zeigt per DNS auf den Server (Ports 80/443 offen).
  maje-proxy:
    image: caddy:2-alpine
    container_name: maje-proxy
    restart: always
    profiles: ["proxy"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/MAJE/caddy/data:/data
      - /opt/MAJE/caddy/config:/config
    depends_on:
      - maje-backend
